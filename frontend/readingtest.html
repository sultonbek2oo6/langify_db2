<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reading Test - Langify</title>
  <style>
    /* ================= GLOBAL STYLES ================= */
    body {
      background-color: #f8fafc;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    #timer-box {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 65px;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 15px rgba(0,0,0,0.08);
      z-index: 1000;
      border-bottom: 3px solid #3498db;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      padding: 20px;
      width: 100%;
      max-width: 1600px;
      height: calc(100vh - 90px); 
      margin: 80px auto 0 auto;
      box-sizing: border-box;
    }

    /* ================= PASSAGE & QUESTIONS BOXES ================= */
    .passage, .questions {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      height: 100%;
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      border: 1px solid #e2e8f0;
      box-sizing: border-box;
    }

    #passage h2 {
      color: #1e3a8a;
      margin-top: 0;
      font-size: 24px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 15px;
    }

    #passage {
      line-height: 1.8;
      font-size: 18px;
      color: #334155;
      font-family: 'Georgia', serif;
      text-align: justify;
    }

    /* ================= QUESTIONS DESIGN ================= */
    .question {
      background: #f1f5f9;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      border-left: 5px solid #3498db;
    }

    .q-text {
      font-size: 17px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 15px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e0;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      border-color: #3498db;
      outline: none;
    }

    /* Radio variantlar - Touch-friendly dizayn */
    .radio-label {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .radio-label:hover {
      background: #f8fafc;
      border-color: #3498db;
    }

    .radio-label input {
      margin-right: 12px;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    /* ================= BUTTONS ================= */
    button[type="submit"] {
      width: 100%;
      padding: 16px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }

    button[type="submit"]:hover {
      background: #2980b9;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: #64748b;
      padding: 12px;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-success {
      background: #10b981;
      padding: 12px;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    /* ================= MOBILE OPTIMIZATION ================= */
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr; /* Bloklar ustma-ust tushadi */
        height: auto;
        margin-top: 75px;
        padding: 15px;
        gap: 20px;
      }
      
      .passage, .questions {
        height: auto;
        overflow-y: visible; /* Alohida skrolni o'chirib, umumiy skrolga o'tamiz */
        padding: 20px;
      }

      #passage {
        font-size: 17px;
      }

      #timer-box span {
        font-size: 18px !important;
      }
    }
  </style>
</head>
<body>
  
  <div id="timer-box">
    <span style="font-size: 20px; font-weight: bold; color: #1e3a8a;">
      🕒 Qolgan vaqt: <span id="time-display" style="color: #ef4444;">20:00</span>
    </span>
  </div>

  <div class="container">
    <div class="passage" id="passage">
      </div>

    <div class="questions">
      <form id="readingForm">
        <div id="questionsContainer"></div>
        
        <div class="footer-nav" style="display: flex; flex-direction: column; gap: 12px; margin-top: 30px; border-top: 1px solid #f1f5f9; padding-top: 20px;">
          <button type="submit" id="submitBtn">Submit Test</button>
          
          <div style="display: flex; justify-content: space-between; gap: 12px;">
            <button type="button" class="btn-secondary" style="flex: 1;" onclick="goToDashboard()">Dashboard</button>
            <button type="button" class="btn-success" style="flex: 1;" onclick="nextTest()">Next Test</button>
          </div>
        </div>
      </form>
      <div id="result"></div>
    </div>
  </div>

  <script src="readingtest.js"></script>
</body>
</html>
