<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="format-detection" content="telephone=no">

<title>Writing Practice</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
/* ================= GLOBAL ================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  -webkit-text-size-adjust:100%;
}

body{
  font-family:'Inter',"Segoe UI",sans-serif;
  background:#f9f7f7;
  color:#1a1a1a;
  overflow-x:hidden;
  min-height:100vh;
}

/* ================= TOP BAR ================= */

.top-bar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  min-height:80px;
  background:#a67272;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:15px 30px;
  z-index:9999;
  box-shadow:0 4px 20px rgba(166,114,114,.2);
  flex-wrap:wrap;
}

.back-btn{
  border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.1);
  color:white;
  padding:12px 18px;
  border-radius:12px;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
  transition:.3s;
}

.back-btn:hover{
  background:white;
  color:#a67272;
}

.date-box{
  background:rgba(255,255,255,.15);
  color:white;
  padding:10px 20px;
  border-radius:12px;
  font-size:16px;
  font-weight:600;
}

.timer-box{
  background:white;
  color:#a67272;
  padding:10px 24px;
  border-radius:14px;
  font-size:28px;
  font-weight:800;
  min-width:120px;
  text-align:center;
}

.ai-btn{
  border:none;
  background:#1a1a1a;
  color:white;
  padding:14px 24px;
  border-radius:12px;
  cursor:pointer;
  font-size:15px;
  font-weight:700;
}

/* ================= MAIN ================= */

.main-layout{
  display:grid;
  grid-template-columns:1fr 1.1fr;
  gap:20px;
  padding:120px 20px 20px;
  min-height:100vh;
}

/* ================= LEFT SIDE ================= */

.question-side{
  overflow:auto;
}

.question-card{
  background:white;
  border:1px solid #eee1da;
  border-radius:24px;
  padding:30px;
  box-shadow:0 10px 30px rgba(0,0,0,.03);
}

.question-badge{
  display:inline-block;
  padding:6px 16px;
  background:#c4b19b;
  color:white;
  border-radius:30px;
  font-size:12px;
  font-weight:800;
  margin-bottom:20px;
}

.question-title{
  font-size:30px;
  font-weight:800;
  color:#33272a;
  line-height:1.3;
  margin-bottom:25px;
}

.question-box{
  background:#f9f7f7;
  padding:24px;
  border-radius:18px;
  margin-bottom:25px;
  font-size:18px;
  line-height:1.8;
  color:#594a4e;
  border-left:5px solid #a67272;
  word-break:break-word;
}

.instructions{
  font-size:15px;
  color:#8c7b7e;
  line-height:1.8;
}

/* ================= RIGHT SIDE ================= */

.editor-side{
  display:flex;
  flex-direction:column;
}

.editor-card{
  flex:1;
  background:white;
  border:1px solid #eee1da;
  border-radius:24px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:0 15px 40px rgba(0,0,0,.04);
}

/* ================= EDITOR HEADER ================= */

.editor-top{
  min-height:60px;
  background:#fdfaf8;
  border-bottom:1px solid #eee1da;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:15px 25px;
  flex-wrap:wrap;
}

.editor-info{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.editor-info div,
.time-info{
  font-weight:600;
  font-size:14px;
  color:#594a4e;
}

/* ================= TOOLBAR ================= */

.toolbar{
  min-height:55px;
  background:white;
  border-bottom:1px solid #f2f2f2;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 20px;
  flex-wrap:wrap;
}

.tool-btn{
  width:40px;
  height:40px;
  border:none;
  background:transparent;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
  color:#594a4e;
}

.tool-btn.active{
  background:#a67272;
  color:white;
}

/* ================= TEXTAREA ================= */

#essay{
  flex:1;
  width:100%;
  min-height:400px;
  border:none;
  outline:none;
  resize:none;
  padding:30px;
  font-size:20px;
  line-height:1.8;
  color:#33272a;
}

/* ================= BUTTONS ================= */

.bottom-controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-top:15px;
  flex-wrap:wrap;
}

.task-btn{
  border:1px solid #eee1da;
  padding:12px 22px;
  border-radius:12px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  background:white;
}

.task-btn.active{
  background:#c4b19b !important;
  color:white !important;
  border-color:#c4b19b;
}

.submit-btn{
  border:none;
  background:#1a1a1a;
  color:white;
  padding:14px 30px;
  border-radius:12px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

/* ================= TABLET ================= */

@media(max-width:1100px){

  .main-layout{
    grid-template-columns:1fr;
  }

  .question-title{
    font-size:26px;
  }
}

/* ================= MOBILE ================= */

@media(max-width:768px){

  .top-bar{
    padding:12px;
    justify-content:center;
    gap:10px;
  }

  .back-btn,
  .ai-btn{
    width:100%;
  }

  .date-box{
    width:100%;
    text-align:center;
  }

  .timer-box{
    width:100%;
    font-size:24px;
  }

  .main-layout{
    padding:220px 12px 20px;
    gap:16px;
  }

  .question-card{
    padding:20px;
    border-radius:18px;
  }

  .question-title{
    font-size:22px;
  }

  .question-box{
    font-size:16px;
    padding:18px;
  }

  .editor-card{
    border-radius:18px;
  }

  .editor-top{
    padding:15px;
  }

  .toolbar{
    padding:12px;
    justify-content:center;
  }

  #essay{
    min-height:350px;
    padding:20px;
    font-size:16px;
  }

  .bottom-controls{
    flex-direction:column;
    align-items:stretch;
  }

  .task-btn,
  .submit-btn{
    width:100%;
  }
}

/* ================= SMALL PHONE ================= */

@media(max-width:480px){

  .main-layout{
    padding-top:250px;
  }

  .question-title{
    font-size:20px;
  }

  .timer-box{
    font-size:22px;
  }

  #essay{
    font-size:15px;
  }
}
</style>
</head>

<body>

<div class="top-bar">
    <button class="back-btn" onclick="goBack()">
        <i class="fa-solid fa-arrow-left"></i> Back to Sets
    </button>
    <div class="date-box" id="currentDate">May 12, 2026</div>
    <div class="timer-box" id="timer">60:00</div>
    <button class="ai-btn" onclick="showAiMessage()">
        <i class="fa-solid fa-robot"></i> AI Check
    </button>
</div>

<div class="main-layout">
    <div class="question-side">
        <div class="question-card">
            <div class="question-badge" id="taskTypeBadge">TASK 1</div>
            <div class="question-title" id="title">Loading Task...</div>
            <div class="question-box" id="prompt">Preparing prompt...</div>
            <div class="instructions">
                <b>Instructions:</b>
                Give reasons for your answer and include relevant examples.
                Write at least <span id="minWords">250</span> words.
            </div>
        </div>
    </div>

    <div class="editor-side">
        <div class="editor-card">
            <div class="editor-top">
                <div class="editor-info">
                    <div class="word-info">
                        <i class="fa-regular fa-file-word"></i> Words: <span id="wordCount">0</span>
                    </div>
                    <div class="min-info">
                        <i class="fa-solid fa-layer-group"></i> Min: <span id="minimumWords">250</span>
                    </div>
                </div>
                <div class="time-info">
                    <i class="fa-regular fa-clock"></i> <span id="topTimer">60:00</span>
                </div>
            </div>

            <div class="toolbar">
                <button class="tool-btn" id="boldBtn"><b>B</b></button>
                <button class="tool-btn" id="italicBtn"><i>I</i></button>
                <button class="tool-btn" id="underlineBtn"><u>U</u></button>
                <button class="tool-btn" id="fontPlus"><i class="fa-solid fa-plus"></i></button>
                <button class="tool-btn" id="fontMinus"><i class="fa-solid fa-minus"></i></button>
                <button class="tool-btn" id="fullscreenBtn"><i class="fa-solid fa-expand"></i></button>
            </div>

            <textarea id="essay" placeholder="Start typing..."></textarea>
        </div>

        <div class="bottom-controls">
            <button class="task-btn task1 active" id="task1Btn">Task 1</button>
            <button class="task-btn task2" id="task2Btn">Task 2</button>
            <button class="submit-btn" onclick="submitEssay()">
                <i class="fa-solid fa-paper-plane"></i> Submit Test
            </button>
        </div>
    </div>
</div>

<script src="writingtest.js"></script>

</body>
</html>
